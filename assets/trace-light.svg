<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d"><title id="t">Claim Court agent trace</title><desc id="d">Animated terminal replaying an illustrative Claim Court run: retrieve_docs, grade_doc, web_search, grade_web, prosecutor and defender, a human review pause, judge_node and verify_citations.</desc><rect x="0.5" y="0.5" width="899" height="379" rx="12" fill="#ffffff" stroke="#d0d7de"/><path d="M0.5,40 L0.5,12.5 Q0.5,0.5 12.5,0.5 L887.5,0.5 Q899.5,0.5 899.5,12.5 L899.5,40 z" fill="#f6f8fa" stroke="#d0d7de"/><line x1="0.5" y1="40.5" x2="899.5" y2="40.5" stroke="#d0d7de"/><circle cx="26" cy="20.5" r="6" fill="#d0d7de"/><circle cx="46" cy="20.5" r="6" fill="#d0d7de"/><circle cx="66" cy="20.5" r="6" fill="#d0d7de"/><circle cx="26" cy="20.5" r="6" fill="#0f766e" opacity="0.9"/><text x="450.0" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#656d76">claim_court / court_graph</text><g opacity="1"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0375;0.0415;0.93;0.96;1" dur="16.0s" repeatCount="indefinite"/><text x="28" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#656d76">claim: "Cold showers boost immunity"</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1031;0.1071;0.93;0.96;1" dur="16.0s" repeatCount="indefinite"/><text x="28" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#656d76">[00:00.0]</text><text x="150" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f766e" font-weight="600">retrieve_docs</text><text x="320" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1f2328">searching document index</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1688;0.1728;0.93;0.96;1" dur="16.0s" repeatCount="indefinite"/><text x="28" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#656d76">[00:00.6]</text><text x="150" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f766e" font-weight="600">grade_doc</text><text x="320" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1f2328">grading retrieved passages</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2344;0.2384;0.93;0.96;1" dur="16.0s" repeatCount="indefinite"/><text x="28" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#656d76">[00:01.4]</text><text x="150" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f766e" font-weight="600">web_search</text><text x="320" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1f2328">query A: evidence for | query B: evidence against</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3000;0.3040;0.93;0.96;1" dur="16.0s" repeatCount="indefinite"/><text x="28" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#656d76">[00:03.1]</text><text x="150" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f766e" font-weight="600">grade_web</text><text x="320" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1f2328">evidence ok, no rewrite needed</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3656;0.3696;0.93;0.96;1" dur="16.0s" repeatCount="indefinite"/><text x="28" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#656d76">[00:03.2]</text><text x="150" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f766e" font-weight="600">prosecutor</text><text x="320" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1f2328">arguing the claim is false (parallel)</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4313;0.4353;0.93;0.96;1" dur="16.0s" repeatCount="indefinite"/><text x="28" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#656d76">[00:03.2]</text><text x="150" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f766e" font-weight="600">defender</text><text x="320" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1f2328">arguing the claim is true (parallel)</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4969;0.5009;0.93;0.96;1" dur="16.0s" repeatCount="indefinite"/><text x="28" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#656d76">[00:06.8]</text><text x="150" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1f2328" font-weight="600">interrupt</text><text x="320" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1f2328">paused for human review</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5625;0.5665;0.93;0.96;1" dur="16.0s" repeatCount="indefinite"/><text x="28" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#656d76">[00:09.0]</text><text x="150" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f766e" font-weight="600">judge_node</text><text x="320" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1f2328">ruling: supported | disputed | unsupported</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6281;0.6321;0.93;0.96;1" dur="16.0s" repeatCount="indefinite"/><text x="28" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#656d76">[00:11.5]</text><text x="150" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f766e" font-weight="600">verify_citations</text><text x="320" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1f2328">checking each citation against its evidence</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6937;0.6977;0.93;0.96;1" dur="16.0s" repeatCount="indefinite"/><text x="28" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#656d76">[00:12.4]</text><text x="150" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f766e" font-weight="600">done</text><text x="320" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1f2328">verdict and citation audit saved to checkpoint</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6937;0.6977;0.93;0.96;1" dur="16.0s" repeatCount="indefinite"/><rect x="740.0" y="363" width="9" height="17" fill="#0f766e"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5001;1" dur="1.1s" repeatCount="indefinite"/></rect></g></svg>
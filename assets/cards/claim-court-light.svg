<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" role="img" aria-labelledby="t d"><title id="t">Claim Court card</title><desc id="d">Pipeline: retrieve_docs, grade_doc, web_search, grade_web, then prosecutor and defender in parallel, judge_node and verify_citations.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#656d76"/></marker><filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="559" height="239" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x="1" y="1" width="558" height="238" rx="11.5" fill="#f6f8fa" opacity="0.55"/><text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0f766e">01 / agent</text><text x="24" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1f2328">Claim Court</text><text x="24" y="82" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#656d76">Two LLM agents argue opposite sides of a claim from the same</text><text x="24" y="101" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#656d76">evidence. A judge rules and a citation audit checks the sources.</text><rect x="24.0" y="115.0" width="112" height="26" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="80.0" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1f2328">retrieve_docs</text><rect x="183.0" y="115.0" width="84" height="26" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="225.0" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1f2328">grade_doc</text><rect x="314.0" y="115.0" width="91" height="26" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="359.5" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1f2328">web_search</text><rect x="452.0" y="115.0" width="84" height="26" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="494.0" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1f2328">grade_web</text><rect x="24.0" y="157.0" width="167" height="26" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="107.5" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1f2328">prosecutor | defender</text><rect x="252.0" y="157.0" width="91" height="26" rx="7" fill="#0f766e" filter="url(#glow)" opacity="0.5"><animate attributeName="opacity" values="0.25;0.7;0.25" dur="4s" repeatCount="indefinite"/></rect><rect x="252.0" y="157.0" width="91" height="26" rx="7" fill="#f6f8fa" stroke="#0f766e" stroke-width="1.5"/><text x="297.5" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1f2328">judge_node</text><rect x="404.0" y="157.0" width="132" height="26" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="470.0" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1f2328">verify_citations</text><path d="M494.0,141.0 L494.0,149 L107.5,149 L107.5,155.0" fill="none" stroke="#656d76" stroke-width="1.3" stroke-linejoin="round" opacity="0.8" marker-end="url(#arr)"/><path d="M136.0,128 L181.0,128" fill="none" stroke="#656d76" stroke-width="1.3" stroke-linejoin="round" opacity="0.8" marker-end="url(#arr)"/><path d="M267.0,128 L312.0,128" fill="none" stroke="#656d76" stroke-width="1.3" stroke-linejoin="round" opacity="0.8" marker-end="url(#arr)"/><path d="M405.0,128 L450.0,128" fill="none" stroke="#656d76" stroke-width="1.3" stroke-linejoin=
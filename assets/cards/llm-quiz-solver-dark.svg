<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" role="img" aria-labelledby="t d"><title id="t">LLM Quiz Solver card</title><desc id="d">Pipeline: FastAPI endpoint, LangGraph loop, then scrape_page, run_code and send_post.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#8b949e"/></marker><filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="559" height="239" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="1" y="1" width="558" height="238" rx="11.5" fill="#161b22" opacity="0.55"/><text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#2dd4bf">02 / agent</text><text x="24" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#e6edf3">LLM Quiz Solver</text><text x="24" y="82" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">Autonomous agent that scrapes quiz pages, runs generated Python</text><text x="24" y="101" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">and submits answers through a FastAPI service.</text><rect x="24.0" y="115.0" width="132" height="26" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="90.0" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e6edf3">FastAPI endpoint</text><rect x="181.0" y="115.0" width="119" height="26" rx="7" fill="#2dd4bf" filter="url(#glow)" opacity="0.5"><animate attributeName="opacity" values="0.25;0.7;0.25" dur="4s" repeatCount="indefinite"/></rect><rect x="181.0" y="115.0" width="119" height="26" rx="7" fill="#161b22" stroke="#2dd4bf" stroke-width="1.5"/><text x="240.5" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e6edf3">LangGraph loop</text><rect x="24.0" y="159.0" width="98" height="26" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="73.0" y="176" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e6edf3">scrape_page</text><rect x="248.5" y="159.0" width="77" height="26" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="287.0" y="176" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e6edf3">run_code</text><rect x="452.0" y="159.0" width="84" height="26" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="494.0" y="176" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e6edf3">send_post</text><path d="M156.0,128 L179.0,128" fill="none" stroke="#8b949e" stroke-width="1.3" stroke-linejoin="round" opacity="0.8" marker-end="url(#arr)"/><path d="M240.5,141 L240.5,150 L73.0,150 L73.0,157.0" fill="none" stroke="#8b949e" stroke-width="1.3" stroke-linejoin="round" opacity="0.8" marker-end="url(#arr)"/><path d="M122.0,172 L246.5,172" fill="none" stroke="#8b949e" stroke-width="1.3" stroke-linejoin="round" opacity="0.8" marker-end="url(#arr)"/><path d="M325.5,172 L450.0,172" fill="none" stroke="#8b949e" stroke-width="1.3" stroke-linejoin="round" opacity="0.8" marker-end="url(#arr)"/><rect x="24" y="198" width="77" height="22" rx="11" fill="#0d1117" stroke="#30363d"/><text x="62.5" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e6edf3">LangGraph</text><rect x="109" y="198" width="44" height="22" rx="11" fill="#0d1117" stroke="#30363d"/><text x="131.0" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e6edf3">Groq</text><rect x="161" y="198" width="64" height="22" rx="11" fill="#0d1117" stroke="#
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" role="img" aria-labelledby="t d"><title id="t">NAGRIK AI card</title><desc id="d">Pipeline: complaint in, classify_intent, RAG chatbot, with the priority scorer alongside.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#656d76"/></marker><filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="559" height="239" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x="1" y="1" width="558" height="238" rx="11.5" fill="#f6f8fa" opacity="0.55"/><text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0f766e">05 / platform</text><text x="24" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1f2328">NAGRIK AI</text><text x="24" y="82" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#656d76">Team civic complaint platform. I designed and built the AI layer:</text><text x="24" y="101" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#656d76">the ML priority scorer and the RAG chatbot.</text><rect x="24.0" y="115.0" width="105" height="26" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="76.5" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1f2328">complaint in</text><rect x="220.5" y="115.0" width="126" height="26" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="283.5" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1f2328">classify_intent</text><rect x="438.0" y="115.0" width="98" height="26" rx="7" fill="#0f766e" filter="url(#glow)" opacity="0.5"><animate attributeName="opacity" values="0.25;0.7;0.25" dur="4s" repeatCount="indefinite"/></rect><rect x="438.0" y="115.0" width="98" height="26" rx="7" fill="#f6f8fa" stroke="#0f766e" stroke-width="1.5"/><text x="487.0" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1f2328">RAG chatbot</text><rect x="220.5" y="159.0" width="126" height="26" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="283.5" y="176" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1f2328">priority scorer</text><path d="M129.0,128 L218.5,128" fill="none" stroke="#656d76" stroke-width="1.3" stroke-linejoin="round" opacity="0.8" marker-end="url(#arr)"/><path d="M346.5,128 L436.0,128" fill="none" stroke="#656d76" stroke-width="1.3" stroke-linejoin="round" opacity="0.8" marker-end="url(#arr)"/><path d="M76.5,141 L76.5,172 L218.5,172" fill="none" stroke="#656d76" stroke-width="1.3" stroke-linejoin="round" opacity="0.8" marker-end="url(#arr)"/><rect x="24" y="198" width="64" height="22" rx="11" fill="#ffffff" stroke="#d0d7de"/><text x="56.0" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1f2328">FastAPI</text><rect x="96" y="198" width="38" height="22" rx="11" fill="#ffffff" stroke="#d0d7de"/><text x="115.0" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1f2328">Vue</text><rect x="142" y="198" width="84" height="22" rx="11" fill="#ffffff" stroke="#d0d7de"/><text x="184.0" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1f2328">PostgreSQL</text><rect x="234" y="198" width="77" height="22" rx="11" fill="#ffffff" stroke="#d0d7de"/><text x="272.5" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1f2328">LangGraph</text><rect x="319" y="19
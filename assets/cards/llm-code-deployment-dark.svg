<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" role="img" aria-labelledby="t d"><title id="t">LLM Code Deployment card</title><desc id="d">Pipeline: request, Gemini generates app, GitHub Pages deploy.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#8b949e"/></marker><filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="559" height="239" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="1" y="1" width="558" height="238" rx="11.5" fill="#161b22" opacity="0.55"/><text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#2dd4bf">03 / service</text><text x="24" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#e6edf3">LLM Code Deployment</text><text x="24" y="82" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">API that takes a task request, generates a web app with an LLM</text><text x="24" y="101" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">and deploys it to GitHub Pages.</text><rect x="24.0" y="135.0" width="70" height="26" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="59.0" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e6edf3">request</text><rect x="158.5" y="135.0" width="160" height="26" rx="7" fill="#2dd4bf" filter="url(#glow)" opacity="0.5"><animate attributeName="opacity" values="0.25;0.7;0.25" dur="4s" repeatCount="indefinite"/></rect><rect x="158.5" y="135.0" width="160" height="26" rx="7" fill="#161b22" stroke="#2dd4bf" stroke-width="1.5"/><text x="238.5" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e6edf3">Gemini generates app</text><rect x="383.0" y="135.0" width="153" height="26" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="459.5" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e6edf3">GitHub Pages deploy</text><path d="M94.0,148 L156.5,148" fill="none" stroke="#8b949e" stroke-width="1.3" stroke-linejoin="round" opacity="0.8" marker-end="url(#arr)"/><path d="M318.5,148 L381.0,148" fill="none" stroke="#8b949e" stroke-width="1.3" stroke-linejoin="round" opacity="0.8" marker-end="url(#arr)"/><rect x="24" y="198" width="64" height="22" rx="11" fill="#0d1117" stroke="#30363d"/><text x="56.0" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e6edf3">Node.js</text><rect x="96" y="198" width="64" height="22" rx="11" fill="#0d1117" stroke="#30363d"/><text x="128.0" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e6edf3">Express</text><rect x="168" y="198" width="84" height="22" rx="11" fill="#0d1117" stroke="#30363d"/><text x="210.0" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e6edf3">Gemini API</text></svg>